# Ground Truth: chi4-repo 的真实契约（人工标注，作为 specforge eval 的对照真值）。
# 该仓库是 chi v4（github.com/go-chi/chi，无 /v5）的 RESTful fixture：无 code/msg/data 信封，
# 成功响应体即业务结构体本身，状态码为真实 HTTP 状态码（200 成功 / 400 错误分支无 body）。
openapi: 3.1.0
info:
  title: example.com/chi4repo API
  version: 1.0.0
paths:
  /api/method:
    get:
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: expand
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /api/stats:
    get:
      operationId: stats
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
  /api/users:
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Bad Request (error branch)
  /api/users/{id}:
    get:
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: expand
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /base-url:
    get:
      operationId: stats
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
components:
  schemas:
    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
        - id
        - name
